// Opt-in only: ./gradlew runServer --init-script gradle/repair-integration.init.gradle
// Uses an isolated development world and stops the server after the assertions.
allprojects { project ->
    afterEvaluate {
        def smoke = project.sourceSets.create('repairIntegration')
        smoke.java.srcDir project.file('src/integrationTest/java')
        smoke.compileClasspath += project.sourceSets.main.output + project.sourceSets.main.compileClasspath
        smoke.runtimeClasspath += project.sourceSets.main.output + project.sourceSets.main.runtimeClasspath
        project.neoForge.mods.named('touhou_little_maid') { sourceSet smoke }
        project.neoForge.runs.named('server') {
            gameDirectory = project.file('build/repair-integration-world')
        }
        project.tasks.named('runServer') {
            doLast {
                def log = project.file('build/repair-integration-world/logs/latest.log')
                if (!log.exists() || !log.getText('UTF-8').contains('REPAIR_INTEGRATION PASS:')) {
                    throw new GradleException('Maid integration assertions did not pass; inspect the isolated server log.')
                }
            }
        }
    }
}
